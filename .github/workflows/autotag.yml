name: Create Tag and Release on Version Change

on:
  push:
    paths:
      - OpenSkin-Designer/updates/version.txt
      - updates/version.txt
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and read version file
        id: get_version
        run: |
          # Cerca il file in più posizioni
          VERSION_FILE=""
          if [ -f "OpenSkin-Designer/updates/version.txt" ]; then
            VERSION_FILE="OpenSkin-Designer/updates/version.txt"
          elif [ -f "updates/version.txt" ]; then
            VERSION_FILE="updates/version.txt"
          else
            VERSION_FILE=$(find . -name "version.txt" | head -1)
          fi
          
          if [ -z "$VERSION_FILE" ]; then
            echo "ERROR: version.txt not found!"
            exit 1
          fi
          
          echo "Found version file: $VERSION_FILE"
          VERSION=$(cat "$VERSION_FILE" | tr -d '\r' | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.get_version.outputs.version }}$"; then
            echo "Tag v${{ steps.get_version.outputs.version }} already exists."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.get_version.outputs.version }}
          git push origin v${{ steps.get_version.outputs.version }}

      - name: Generate changelog
        id: changelog
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude "v${{ steps.get_version.outputs.version }}" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -n 10)
          else
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges -n 10)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG//'%'/'%25'}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## Changes in this release
            ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
