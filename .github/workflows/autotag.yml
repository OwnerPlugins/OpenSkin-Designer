name: Create Tag and Release on Version Change

on:
  push:
    paths:
      - updates/versione.txt
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - show file content
        run: |
          echo "Content of updates/versione.txt:"
          cat updates/versione.txt
          echo ""
          echo "Hex dump:"
          od -c updates/versione.txt || true

      - name: Read version from file
        id: get_version
        run: |
          # Read the file, trim whitespace and newline
          VERSION=$(cat updates/versione.txt | tr -d '\r' | tr -d '\n' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: '$VERSION'"

      - name: Check if tag already exists
        id: check_tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "ERROR: version is empty"
            exit 1
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "Tag v${VERSION} already exists."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Generate changelog
        id: changelog
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude "v${VERSION}" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -n 10)
          else
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges -n 10)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG//'%'/'%25'}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## Changes in this release
            ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
